<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de voces TTS</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #050505;
      color: #f2f2f2;
      font-family: system-ui, sans-serif;
    }

    h1 {
      font-size: 1.4rem;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      font-size: 1rem;
      box-sizing: border-box;
      border-radius: 10px;
      padding: 10px;
    }

    button {
      width: 100%;
      margin: 6px 0;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
    }

    .voice {
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 10px;
      margin: 10px 0;
    }

    .name {
      font-weight: bold;
      color: #8cff8c;
    }

    .details {
      color: #aaa;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .small {
      color: #aaa;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <h1>Prueba de voces disponibles</h1>

  <p class="small">
    Pulsa “Cargar voces”. Luego prueba cada voz. En algunos móviles las voces tardan unos segundos en aparecer.
  </p>

  <textarea id="text">
Bienvenido al prototipo. Pulsa subir el volumen para elegir la primera opción, y bajar el volumen para la segunda opción.
  </textarea>

  <button id="loadVoices">Cargar voces</button>
  <button id="stop">Parar voz</button>

  <div id="status">Sin cargar.</div>
  <div id="voices"></div>

  <script>
    const textArea = document.getElementById("text");
    const loadButton = document.getElementById("loadVoices");
    const stopButton = document.getElementById("stop");
    const statusDiv = document.getElementById("status");
    const voicesDiv = document.getElementById("voices");

    let voices = [];

    function speakWithVoice(voice) {
      speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(textArea.value);
      utterance.voice = voice;
      utterance.lang = voice.lang || "es-ES";
      utterance.rate = 0.95;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;

      speechSynthesis.speak(utterance);
    }

    function loadVoices() {
      voices = speechSynthesis.getVoices();

      voicesDiv.innerHTML = "";

      if (!voices.length) {
        statusDiv.textContent = "No se han encontrado voces todavía. Espera unos segundos y pulsa de nuevo.";
        return;
      }

      statusDiv.textContent = "Voces encontradas: " + voices.length;

      const spanishVoices = voices.filter(v =>
        v.lang && v.lang.toLowerCase().startsWith("es")
      );

      const otherVoices = voices.filter(v =>
        !v.lang || !v.lang.toLowerCase().startsWith("es")
      );

      const orderedVoices = [...spanishVoices, ...otherVoices];

      orderedVoices.forEach((voice, index) => {
        const card = document.createElement("div");
        card.className = "voice";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = index + 1 + ". " + voice.name;

        const details = document.createElement("div");
        details.className = "details";
        details.textContent =
          "Idioma: " + voice.lang +
          " | Local: " + voice.localService +
          " | Predeterminada: " + voice.default;

        const button = document.createElement("button");
        button.textContent = "Probar esta voz";
        button.onclick = () => speakWithVoice(voice);

        card.appendChild(name);
        card.appendChild(details);
        card.appendChild(button);

        voicesDiv.appendChild(card);
      });
    }

    loadButton.addEventListener("click", loadVoices);

    stopButton.addEventListener("click", () => {
      speechSynthesis.cancel();
    });

    speechSynthesis.onvoiceschanged = loadVoices;

    setTimeout(loadVoices, 500);
    setTimeout(loadVoices, 1500);
    setTimeout(loadVoices, 3000);
  </script>
</body>
</html>
